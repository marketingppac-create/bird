<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>P-PAC WORKSPACE</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Kanit:wght@300;400;500&display=swap');
    
    body {
      font-family: 'Outfit', 'Kanit', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #FAFAFA;
    }
  </style>
</head>
<body class="text-slate-700 m-0 p-0 min-h-screen flex flex-col items-center relative overflow-x-hidden selection:bg-slate-200 selection:text-slate-900">

  <div class="w-full max-w-4xl px-6 pt-32 pb-20 flex flex-col items-center text-center z-10">
    
    <h1 class="text-5xl md:text-6xl font-semibold text-slate-800 mb-6 tracking-tight">P-PAC Workspace</h1>
    
    <p class="text-sm md:text-base font-medium text-slate-400 mb-10">ระบบจัดการงานทั่วไป</p>

    <div class="flex flex-col sm:flex-row gap-4 sm:gap-6 justify-center w-full mb-16">
        
        <a href="https://script.google.com/macros/s/AKfycbxcE64x4vMA_Xmi2w5AYUAsoLM-oxBt_XTKfYSxQZZmeHDvG-nQN9-BG2ze0NF7AgJMcA/exec" target="_blank" 
           class="min-w-[200px] px-10 py-4 rounded-full bg-[#00d4ff] hover:bg-[#00c0e6] text-white font-medium text-lg shadow-[0_10px_30px_-10px_rgba(0,212,255,0.5)] transition-all hover:-translate-y-1 hover:shadow-[0_15px_35px_-10px_rgba(0,212,255,0.6)] no-underline">
           สร้างงานใหม่
        </a>

        <a href="#" target="_blank" 
           class="min-w-[200px] px-10 py-4 rounded-full bg-[#ff9e5e] hover:bg-[#ff8a3d] text-white font-medium text-lg shadow-[0_10px_30px_-10px_rgba(255,158,94,0.5)] transition-all hover:-translate-y-1 hover:shadow-[0_15px_35px_-10px_rgba(255,158,94,0.6)] no-underline">
           จัดการงาน
        </a>

    </div>

    <div class="w-full max-w-2xl bg-white border border-slate-100 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.02)] p-6 mb-20 cursor-pointer hover:shadow-[0_8px_30px_rgb(0,0,0,0.06)] transition-all flex items-center justify-between group">
        <div class="flex items-center gap-5">
            <div class="w-12 h-12 rounded-2xl bg-blue-50/50 flex items-center justify-center text-blue-500 border border-blue-100/50 group-hover:bg-blue-50 transition-colors">
                <i data-lucide="folder" class="w-6 h-6"></i>
            </div>
            <span class="font-medium text-xl text-slate-700 tracking-wide">เอกสารสื่อสารองค์กร</span>
        </div>
        <div class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-50 group-hover:bg-slate-100 transition-colors">
            <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400"></i>
        </div>
    </div>

    <div class="flex flex-col items-center gap-4">
        <p class="text-xs text-slate-400 font-light tracking-wide">สำหรับแจ้งปัญหาหรือเพิ่มเติม</p>
        <button class="px-8 py-3 rounded-full border border-slate-200 text-slate-500 text-sm font-medium hover:bg-slate-50 hover:text-slate-700 hover:border-slate-300 transition-all">
            แจ้ง Requirement (Dev)
        </button>
    </div>

  </div>

  <div class="fixed bottom-8 right-8 flex flex-col items-end gap-4 z-50">
    
    <div class="flex items-center gap-3 px-6 py-3.5 rounded-2xl bg-white/80 backdrop-blur-xl border border-white shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] cursor-default">
      <div class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
      </div>
      <span class="font-light text-sm text-slate-500 tracking-wide">Welcome, <span id="displayUsername" class="font-medium text-slate-800">User</span></span>
    </div>

    <div class="flex items-center gap-3">
      
      <button title="Menu" class="flex items-center justify-center w-[3.25rem] h-[3.25rem] rounded-2xl bg-white/80 backdrop-blur-xl border border-white hover:bg-slate-900 hover:text-white transition-all duration-500 text-slate-600 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] hover:shadow-xl cursor-pointer">
          <i data-lucide="layout-grid" class="w-5 h-5"></i>
      </button>

      <a href="index.html" id="logoutBtn" title="Sign Out" class="flex items-center gap-2.5 px-6 py-3.5 rounded-2xl bg-white/80 backdrop-blur-xl border border-white hover:bg-red-50 hover:text-red-500 hover:border-red-100 transition-all duration-500 text-slate-600 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] cursor-pointer no-underline group">
          <i data-lucide="log-out" class="w-4 h-4 transition-transform duration-500 group-hover:translate-x-1"></i>
          <span class="font-medium text-sm tracking-wide">Sign Out</span>
      </a>
      
    </div>
  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // ดึงชื่อ User มาโชว์
    const activeUser = localStorage.getItem('ppac_active_user');
    if (activeUser) {
        document.getElementById('displayUsername').innerText = activeUser;
    }

    // ล้างค่า Session เมื่อ Sign out
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('ppac_active_user');
    });
  </script>
</body>
</html>
